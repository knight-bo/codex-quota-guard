[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-quota-guard"
version = "0.3.0"
description = "Conservative read-only Codex quota monitor with explicit managed-turn interruption"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
codex-quota-guard = "quota_guard.cli:main"

[tool.setuptools.packages.find]
include = ["quota_guard*"]

[tool.setuptools.package-data]
quota_guard = ["locales/*.json"]
