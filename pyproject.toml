[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-quota-guard"
version = "0.5.0"
description = "Codex quota monitoring and separate opt-in public reset announcements"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
codex-quota-guard = "quota_guard.cli:main"

[tool.setuptools.packages.find]
include = ["quota_guard*"]

[tool.setuptools.package-data]
quota_guard = ["locales/*.json"]
